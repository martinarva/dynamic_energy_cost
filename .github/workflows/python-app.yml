# Run the test suite against the Home Assistant releases users run.

name: Python application Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test package pins a Home Assistant release, and the Python
        # version decides which one is installed: 3.13 gets the last release
        # that still runs on it (2026.2), 3.14 the current one. Testing both
        # covers users who have not updated Home Assistant yet as well as the
        # latest release.
        python-version: ["3.13", "3.14"]

    steps:
    - name: Check out the repository
      uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt
    - name: Show the Home Assistant version under test
      run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
    - name: Test with pytest
      run: |
        pytest
